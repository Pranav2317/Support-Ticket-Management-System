services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/helpdesk
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      CLIENT_ORIGIN: http://localhost:5000

volumes:
  mongo-data:
